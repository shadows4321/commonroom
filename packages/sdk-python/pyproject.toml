[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonroom"
version = "0.7.0"
description = "Python SDK for connecting an AI companion to a commonroom world."
requires-python = ">=3.10"
dependencies = ["commonroom-protocol", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "commonroom-server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
