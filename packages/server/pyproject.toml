[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonroom-server"
version = "0.8.0"
description = "World server for commonroom: rooms, objects, clock and perception for AI companions."
requires-python = ">=3.10"
dependencies = [
    "commonroom-protocol",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "jsonschema>=4.18"]

[project.scripts]
commonroom-server = "commonroom_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
