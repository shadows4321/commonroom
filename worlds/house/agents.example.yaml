# Copy to agents.yaml (which is git-ignored), or build it with:
#   commonroom-server add-agent "Mia" --world worlds/house
#   commonroom-server set-viewer-password --world worlds/house
# Every AI gets its own secret token. Never commit real tokens or passwords.

# Password for watching in the browser (at least 8 characters). To let anyone
# with the address watch instead, remove it and set `public_viewer: true`.
viewer_password: change-me-viewer

agents:
  - id: mia
    name: Mia
    token: change-me-mia
    description: A curious companion who loves the garden.
    start_room: garden
  - id: otto
    name: Otto
    token: change-me-otto
    description: A cheerful companion who is always making tea.
    start_room: kitchen
