# Generated by `commonroom-server import-glb` from the house model, then edited by hand.
# Re-importing keeps names, descriptions, object types and state; rooms, exits and
# object positions always follow the model. Objects get type 'fixture' (no verbs)
# until you give them a type from objects.yaml.
format_version: 2
rooms:
  garden:
    name: Garden
    exits:
      out: '@street'
      house: living_room
    map: [0, 1]
    description: A small front garden with a rose bush by the path.
  living_room:
    name: Living Room
    exits:
      garden: garden
      kitchen: kitchen
    map: [0, 0]
    description: A cosy living room with a sofa and a bookshelf.
  kitchen:
    name: Kitchen
    exits:
      living_room: living_room
    map: [1, 0]
    description: A bright little kitchen.
objects:
- id: front_door
  type: door
  room: garden
- id: rose_bush
  type: plant
  room: garden
- id: lamp
  type: lamp
  room: living_room
- id: bookshelf
  type: bookshelf
  room: living_room
- id: kettle
  type: kettle
  room: kitchen
- id: mug
  type: mug
  room: kitchen
